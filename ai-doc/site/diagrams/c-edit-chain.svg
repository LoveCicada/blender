<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 210" role="img">
  <title>Edit mode Mesh and BMesh</title>
  <rect x="20" y="70" width="160" height="70" rx="6" fill="#efe2cf" stroke="#1c1917"/>
  <text x="100" y="100" text-anchor="middle" font-size="13" font-weight="700">DNA Mesh</text>
  <text x="100" y="120" text-anchor="middle" font-size="11" fill="#44403c">persistent</text>
  <path d="M180 105 H220" stroke="#c45c26" stroke-width="2"/>
  <rect x="220" y="70" width="200" height="70" rx="6" fill="#f3d9cc" stroke="#1c1917"/>
  <text x="320" y="96" text-anchor="middle" font-size="13" font-weight="700">EDBM_mesh_make</text>
  <text x="320" y="116" text-anchor="middle" font-size="11" fill="#44403c">BM_mesh_bm_from_me</text>
  <path d="M420 105 H460" stroke="#c45c26" stroke-width="2"/>
  <rect x="460" y="70" width="200" height="70" rx="6" fill="#f3d9cc" stroke="#1c1917"/>
  <text x="560" y="96" text-anchor="middle" font-size="13" font-weight="700">BMEditMesh</text>
  <text x="560" y="116" text-anchor="middle" font-size="11" fill="#44403c">runtime.edit_mesh</text>
  <path d="M660 105 H700" stroke="#c45c26" stroke-width="2"/>
  <rect x="700" y="70" width="260" height="70" rx="6" fill="#dceceb" stroke="#1c1917"/>
  <text x="830" y="96" text-anchor="middle" font-size="13" font-weight="700">leave: EDBM_mesh_load</text>
  <text x="830" y="116" text-anchor="middle" font-size="11" fill="#44403c">BM_mesh_bm_to_me</text>
  <text x="20" y="40" font-size="13" fill="#8a3d14">Stay in edit: mutate bm + EDBM_update; DNA Mesh stays stale</text>
</svg>
