<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img">
  <title>Neighbors around mesh editing</title>
  <defs>
    <marker id="n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2a6f6f"/>
    </marker>
  </defs>
  <rect x="30" y="110" width="150" height="64" rx="6" fill="#efe2cf" stroke="#1c1917"/>
  <text x="105" y="138" text-anchor="middle" font-size="14" font-weight="700">editors/mesh</text>
  <text x="105" y="158" text-anchor="middle" font-size="11" fill="#44403c">extrude / cut / select</text>
  <path d="M180 142 H230" stroke="#2a6f6f" stroke-width="2" fill="none" marker-end="url(#n)"/>
  <rect x="230" y="110" width="140" height="64" rx="6" fill="#f3d9cc" stroke="#1c1917"/>
  <text x="300" y="138" text-anchor="middle" font-size="14" font-weight="700">bmesh</text>
  <text x="300" y="158" text-anchor="middle" font-size="11" fill="#44403c">edit topology</text>
  <path d="M370 142 H420" stroke="#2a6f6f" stroke-width="2" fill="none" marker-end="url(#n)"/>
  <rect x="420" y="110" width="140" height="64" rx="6" fill="#f3d9cc" stroke="#1c1917"/>
  <text x="490" y="138" text-anchor="middle" font-size="14" font-weight="700">Mesh / BKE</text>
  <text x="490" y="158" text-anchor="middle" font-size="11" fill="#44403c">persistent mesh</text>
  <path d="M560 142 H610" stroke="#2a6f6f" stroke-width="2" fill="none" marker-end="url(#n)"/>
  <rect x="610" y="110" width="140" height="64" rx="6" fill="#dceceb" stroke="#1c1917"/>
  <text x="680" y="138" text-anchor="middle" font-size="14" font-weight="700">modifiers</text>
  <text x="680" y="158" text-anchor="middle" font-size="11" fill="#44403c">on evaluate</text>
  <path d="M750 130 C775 130 775 72 800 72" stroke="#2a6f6f" stroke-width="2" fill="none" marker-end="url(#n)"/>
  <path d="M750 154 C775 154 775 212 800 212" stroke="#2a6f6f" stroke-width="2" fill="none" marker-end="url(#n)"/>
  <rect x="800" y="40" width="150" height="64" rx="6" fill="#d7e6d7" stroke="#1c1917"/>
  <text x="875" y="68" text-anchor="middle" font-size="14" font-weight="700">draw</text>
  <text x="875" y="88" text-anchor="middle" font-size="11" fill="#44403c">viewport</text>
  <rect x="800" y="180" width="150" height="64" rx="6" fill="#e4d7ee" stroke="#1c1917"/>
  <text x="875" y="208" text-anchor="middle" font-size="14" font-weight="700">Cycles</text>
  <text x="875" y="228" text-anchor="middle" font-size="11" fill="#44403c">render mesh</text>
