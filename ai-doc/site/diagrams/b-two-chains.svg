<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" role="img">
  <title>Two update chains</title>
  <text x="20" y="28" font-size="14" font-weight="700" fill="#8a3d14">A. Property click</text>
  <rect x="20" y="42" width="130" height="52" rx="5" fill="#efe2cf" stroke="#1c1917"/>
  <text x="85" y="73" text-anchor="middle" font-size="13" font-weight="700">UI button</text>
  <path d="M150 68 H180" stroke="#c45c26" stroke-width="2"/>
  <rect x="180" y="42" width="150" height="52" rx="5" fill="#efe2cf" stroke="#1c1917"/>
  <text x="255" y="73" text-anchor="middle" font-size="13" font-weight="700">RNA set</text>
  <path d="M330 68 H360" stroke="#c45c26" stroke-width="2"/>
  <rect x="360" y="42" width="150" height="52" rx="5" fill="#f3d9cc" stroke="#1c1917"/>
  <text x="435" y="73" text-anchor="middle" font-size="13" font-weight="700">DNA field</text>
  <path d="M510 68 H540" stroke="#c45c26" stroke-width="2"/>
  <rect x="540" y="42" width="190" height="52" rx="5" fill="#dceceb" stroke="#1c1917"/>
  <text x="635" y="73" text-anchor="middle" font-size="13" font-weight="700">RNA_property_update</text>
  <path d="M730 68 H760" stroke="#c45c26" stroke-width="2"/>
  <rect x="760" y="42" width="200" height="52" rx="5" fill="#d7e6d7" stroke="#1c1917"/>
  <text x="860" y="65" text-anchor="middle" font-size="12" font-weight="700">DEG_id_tag_update</text>
  <text x="860" y="82" text-anchor="middle" font-size="11" fill="#44403c">WM_main_add_notifier</text>

  <text x="20" y="168" font-size="14" font-weight="700" fill="#8a3d14">B. Operator (keymap / menu)</text>
  <rect x="20" y="182" width="130" height="52" rx="5" fill="#efe2cf" stroke="#1c1917"/>
  <text x="85" y="213" text-anchor="middle" font-size="13" font-weight="700">WM invoke</text>
  <path d="M150 208 H180" stroke="#2a6f6f" stroke-width="2"/>
  <rect x="180" y="182" width="150" height="52" rx="5" fill="#efe2cf" stroke="#1c1917"/>
  <text x="255" y="213" text-anchor="middle" font-size="13" font-weight="700">ot-&gt;exec</text>
  <path d="M330 208 H360" stroke="#2a6f6f" stroke-width="2"/>
  <rect x="360" y="182" width="150" height="52" rx="5" fill="#f3d9cc" stroke="#1c1917"/>
  <text x="435" y="213" text-anchor="middle" font-size="13" font-weight="700">mutate data</text>
  <path d="M510 208 H540" stroke="#2a6f6f" stroke-width="2"/>
  <rect x="540" y="182" width="190" height="52" rx="5" fill="#dceceb" stroke="#1c1917"/>
  <text x="635" y="213" text-anchor="middle" font-size="13" font-weight="700">EDBM_update / tag</text>
  <path d="M730 208 H760" stroke="#2a6f6f" stroke-width="2"/>
  <rect x="760" y="182" width="200" height="52" rx="5" fill="#e4d7ee" stroke="#1c1917"/>
  <text x="860" y="205" text-anchor="middle" font-size="12" font-weight="700">same notifier + DEG</text>
  <text x="860" y="222" text-anchor="middle" font-size="11" fill="#44403c">plus ED_undo_push_op</text>
</svg>
